<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Daily Work Notes</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #2563eb;
            --primary-hover: #1d4ed8;
            --secondary: #475569;
            --bg-color: #f8fafc;
            --card-bg: #ffffff;
            --text-main: #0f172a;
            --text-muted: #64748b;
            --border-color: #e2e8f0;
            --success: #10b981;
            --success-hover: #059669;
            --danger: #ef4444;
            --danger-hover: #dc2626;
            --warning-bg: #fffbeb;
            --warning-border: #fde68a;
            --warning-text: #92400e;
            --input-bg: #ffffff;
            --radius: 8px;
        }

        [data-theme="dark"] {
            --primary: #3b82f6;
            --primary-hover: #2563eb;
            --secondary: #94a3b8;
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --border-color: #334155;
            --success: #059669;
            --success-hover: #047857;
            --danger: #dc2626;
            --danger-hover: #b91c1c;
            --warning-bg: #451a03;
            --warning-border: #78350f;
            --warning-text: #fde68a;
            --input-bg: #0f172a;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Inter', 'Segoe UI', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            padding: 20px 10px;
            line-height: 1.5;
            transition: background-color 0.3s, color 0.3s;
        }

        .container {
            max-width: 1000px;
            margin: 0 auto;
            background: var(--card-bg);
            padding: 24px;
            border-radius: 12px;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.05);
            border: 1px solid var(--border-color);
            transition: background-color 0.3s, border-color 0.3s;
        }

        /* Header & Theme Toggle */
        .app-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 2px solid var(--border-color);
            padding-bottom: 12px;
            margin-bottom: 24px;
            position: relative;
        }
        h2 {
            color: var(--text-main);
            font-size: 22px;
            font-weight: 700;
            text-align: center;
            flex-grow: 1;
        }
        .theme-toggle-btn {
            background: var(--border-color);
            border: none;
            color: var(--text-main);
            padding: 8px 12px;
            border-radius: var(--radius);
            cursor: pointer;
            font-size: 14px;
            font-weight: 600;
            transition: background 0.2s;
        }
        .theme-toggle-btn:hover {
            opacity: 0.8;
        }

        /* Navigasi Tab Utama (Rata Tengah & Proporsional) */
        .main-tabs {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin-bottom: 24px;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 12px;
            flex-wrap: wrap;
        }
        .tab-btn {
            padding: 10px 16px;
            border: none;
            background-color: var(--border-color);
            color: var(--text-muted);
            font-weight: 600;
            font-size: 13px;
            border-radius: var(--radius);
            cursor: pointer;
            transition: all 0.2s ease;
        }
        .tab-btn:hover {
            opacity: 0.8;
            color: var(--text-main);
        }
        .tab-btn.active {
            background-color: var(--primary);
            color: white;
        }

        .sub-tabs {
            display: flex;
            gap: 8px;
            margin-bottom: 24px;
            background: var(--border-color);
            padding: 6px;
            border-radius: var(--radius);
        }

            flex: 1;
            padding: 10px 15px;
            border: none;
            background: transparent;
            color: var(--text-muted);
